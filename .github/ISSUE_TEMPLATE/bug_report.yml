name: 🐛 Bug Report
description: File a bug report to help improve KrishiSetu AI
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in KrishiSetu AI!
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the platform is affected?
      options:
        - Farmer Portal & Mandi Discovery
        - Vision AI Quality Grading
        - FPO Freight Pooling & Logistics (OR-Tools)
        - Nodal Settlement & Escrow Sandbox
        - SHA-256 Audit Ledger
        - Bhashini Voice Assistant
        - Backend REST API (FastAPI)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Go to '/farmer'
        2. Click on 'Grade Crop'
        3. Upload sample photo
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device, Node.js version
      placeholder: Chrome 124, Windows 11, Node 20.x
